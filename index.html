<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Growth | Grow Smarter</title>

<meta name="description" content="Business Growth - simple tools, calculators and learning resources for business planning and growth.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --primary:#0f766e;
  --primary2:#14b8a6;
  --border:#e5e7eb;
  --shadow:0 10px 30px rgba(0,0,0,.07)
}

body.dark{
  --bg:#0b1220;
  --card:#121c2e;
  --text:#f5f7ff;
  --muted:#aab4c5;
  --border:#26344a;
  --shadow:0 10px 30px rgba(0,0,0,.25)
}

html{
  scroll-behavior:smooth
}

body{
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  transition:.3s
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 3px 18px rgba(0,0,0,.05)
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:13px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  display:flex;
  align-items:center;
  gap:11px
}

.logo,
.about-logo{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;
  align-items:center;
  justify-content:center
}

.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  box-shadow:0 7px 18px rgba(15,118,110,.25)
}

.logo svg{
  width:27px;
  height:27px
}

.brand-name{
  font-size:20px;
  font-weight:800
}

.brand-name span,
.footer-brand span{
  color:var(--primary)
}

nav{
  display:flex;
  align-items:center;
  gap:17px
}

nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:600
}

nav a:hover{
  color:var(--primary)
}

.menu{
  display:none;
  font-size:27px;
  cursor:pointer
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}

.btn:hover{
  transform:translateY(-1px);
  opacity:.92
}

/* PROFESSIONAL HOME */
.hero{
  max-width:1150px;
  margin:auto;
  padding:80px 20px 60px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:40px;
  align-items:center
}

.badge{
  display:inline-block;
  padding:7px 13px;
  border-radius:30px;
  background:#dff8f4;
  color:#08766e;
  font-size:13px;
  font-weight:700;
  margin-bottom:16px
}

body.dark .badge{
  background:#123d3a;
  color:#75e8dc
}

.hero h1{
  font-size:54px;
  line-height:1.08;
  margin-bottom:18px
}

.hero h1 span{
  color:var(--primary)
}

.hero p{
  max-width:620px;
  color:var(--muted);
  font-size:17px;
  margin-bottom:25px
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.hero-card{
  background:linear-gradient(145deg,var(--primary),var(--primary2));
  color:white;
  padding:40px;
  border-radius:28px;
  box-shadow:var(--shadow)
}

.hero-card-icon{
  font-size:62px;
  margin-bottom:12px
}

.hero-card h2{
  font-size:29px;
  margin-bottom:7px
}

.stats{
  max-width:1150px;
  margin:0 auto 45px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px
}
