<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9lBmoY4FmQzVxJ4FIpohuirAdk4RWny",
  authDomain: "business-growth-3d243.firebaseapp.com",
  projectId: "business-growth-3d243",
  storageBucket: "business-growth-3d243.firebasestorage.app",
  messagingSenderId: "566770152061",
  appId: "1:566770152061:web:c70917ca65d944fa1a3714"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const statusBox = document.getElementById("authStatus");
const logoutBtn = document.getElementById("logoutBtn");

function showAuthMessage(message, success = false) {
  statusBox.innerText = message;
  statusBox.className =
    "auth-status " + (success ? "auth-success" : "auth-error");
}

function showLogin() {
  document.getElementById("authLoginForm").style.display = "block";
  document.getElementById("authSignupForm").style.display = "none";

  document.getElementById("loginTab").style.background = "var(--primary)";
  document.getElementById("loginTab").style.color = "white";

  document.getElementById("signupTab").style.background = "transparent";
  document.getElementById("signupTab").style.color = "var(--primary)";
}

function showSignup() {
  document.getElementById("authLoginForm").style.display = "none";
  document.getElementById("authSignupForm").style.display = "block";

  document.getElementById("signupTab").style.background = "var(--primary)";
  document.getElementById("signupTab").style.color = "white";

  document.getElementById("loginTab").style.background = "transparent";
  document.getElementById("loginTab").style.color = "var(--primary)";
}

async function signupUser() {

  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!email || !password) {
    showAuthMessage("Email और password डालें।");
    return;
  }

  if (password.length < 6) {
    showAuthMessage("Password कम से कम 6 characters का होना चाहिए।");
    return;
  }

  try {

    await auth.createUserWithEmailAndPassword(email, password);

    showAuthMessage(
      "Account successfully created!",
      true
    );

  } catch (error) {

    console.error(error);

    if (error.code === "auth/email-already-in-use") {
      showAuthMessage("यह email पहले से registered है। Login करें।");
    } else if (error.code === "auth/invalid-email") {
      showAuthMessage("Email सही नहीं है।");
    } else if (error.code === "auth/weak-password") {
      showAuthMessage("Password बहुत छोटा है।");
    } else if (error.code === "auth/operation-not-allowed") {
      showAuthMessage("Firebase में Email/Password Login enable नहीं है।");
    } else if (error.code === "auth/unauthorized-domain") {
      showAuthMessage("GitHub domain Firebase में authorized नहीं है।");
    } else {
      showAuthMessage("Signup error: " + error.message);
    }

  }
}

async function loginUser() {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showAuthMessage("Email और password डालें।");
    return;
  }

  try {

    await auth.signInWithEmailAndPassword(email, password);

    showAuthMessage(
      "Login successful!",
      true
    );

  } catch (error) {

    console.error(error);

    if (
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found" ||
      error.code === "auth/invalid-credential"
    ) {
      showAuthMessage("Email या password गलत है।");
    } else if (error.code === "auth/unauthorized-domain") {
      showAuthMessage("GitHub domain Firebase में authorized नहीं है।");
    } else {
      showAuthMessage("Login error: " + error.message);
    }

  }
}

async function resetPassword() {

  const email =
    document.getElementById("loginEmail").value.trim();

  if (!email) {
    showAuthMessage("पहले अपना email डालें।");
    return;
  }

  try {

    await auth.sendPasswordResetEmail(email);

    showAuthMessage(
      "Password reset email भेज दिया गया है।",
      true
    );

  } catch (error) {

    showAuthMessage(
      "Reset error: " + error.message
    );

  }
}

async function logoutUser() {

  try {

    await auth.signOut();

    showAuthMessage(
      "Logout successful.",
      true
    );

  } catch (error) {

    showAuthMessage(
      "Logout error: " + error.message
    );

  }
}

auth.onAuthStateChanged(function(user) {

  if (user) {

    showAuthMessage(
      "Logged in as: " + user.email,
      true
    );

    logoutBtn.style.display = "inline-block";

  } else {

    showAuthMessage(
      "Firebase ready. You can Login or Sign Up.",
      true
    );

    logoutBtn.style.display = "none";

  }

});
</script>
